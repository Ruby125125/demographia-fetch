name: Fetch missing Demographia editions (content-aligned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download 5 missing editions by reading real edition number
        run: |
          python3 - <<'PY'
          import json, os, ssl, time, urllib.request, re

          CTX = ssl.create_default_context()
          CTX.check_hostname = False
          CTX.verify_mode = ssl.CERT_NONE
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"}

          def get(u):
              return urllib.request.urlopen(
                  urllib.request.Request(u, headers=UA), timeout=300, context=CTX).read()

          # 目标期数 -> (搜索起始时间戳, 搜索结束时间戳)
          # 窗口设在"上一期发布"与"下一期发布"之间，确保只命中目标期
          MISSING = {
              3:  ("20060601000000", "20070301000000"),   # 3rd: 2nd(2006.02)之后, 4th(2007.03)之前
              7:  ("20110301000000", "20120101000000"),   # 7th: 2011
              11: ("20150301000000", "20160101000000"),   # 11th: 2015
              12: ("20160301000000", "20170101000000"),   # 12th 完整版: 2016
              19: ("20230301000000", "20250101000000"),   # 19th: 2023~2024
          }

          def real_edition(body):
              # 直接在 PDF 原始字节里找 "Nth Annual/Comprehensive Edition"（封面为明文）
              txt = body.decode('latin-1', 'ignore')
              m = re.search(r'(\d{1,2})\s*(st|nd|rd|th)\s+(?:Annual|Comprehensive)\s+Edition', txt, re.I)
              return int(m.group(1)) if m else None

          os.makedirs("editions", exist_ok=True)
          for ed, (start, end) in MISSING.items():
              print(f"[*] 寻找第 {ed} 期 (窗口 {start}~{end})")
              cdx = ("https://web.archive.org/cdx/search/cdx?url=demographia.com/db-worldua.pdf"
                     f"&output=json&filter=statuscode:200&from={start[:4]}&to={end[:4]}&limit=50000")
              try:
                  data = json.loads(get(cdx))
              except Exception as e:
                  print("  CDX 查询失败:", e); continue
              if len(data) < 2:
                  print("  无快照"); continue
              h = data[0]
              ti = h.index("timestamp"); oi = h.index("original")
              snaps = sorted(((r[ti], r[oi]) for r in data[1:] if start <= r[ti] <= end), key=lambda c: c[0])
              print(f"  命中 {len(snaps)} 个候选快照")
              done = False
              for ts, orig in snaps:
                  for mod in ("id_", ""):
                      try:
                          body = get(f"https://web.archive.org/web/{ts}{mod}/{orig}")
                          if body[:5] != b"%PDF-":
                              continue
                          re_ed = real_edition(body)
                          if re_ed == ed:
                              open(f"editions/Demographia_{ed}th.pdf", "wb").write(body)
                              print(f"  [OK] 第{ed}期 <- 快照{ts} (内容确认为第{re_ed}期, {len(body):,} B)")
                              done = True; break
                      except Exception:
                          pass
                  if done:
                      break
              if not done:
                  print(f"  [FAIL] 第{ed}期未找到（可能该窗口内 Wayback 无此期原始 PDF）")
              time.sleep(0.5)

          print("\n==== 完成 ====")
          for f in sorted(os.listdir("editions")):
              print("  ", f, os.path.getsize(os.path.join("editions", f)), "bytes")
          PY

      - name: Upload missing editions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demographia-missing
          path: editions/*.pdf
          if-no-files-found: warn
          retention-days: 90
